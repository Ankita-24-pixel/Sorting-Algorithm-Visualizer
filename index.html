<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
    <h1>Sorting Algorithm Visualizer</h1>

    <div class="input-group">
        <label>Enter size of array:</label>
        <input type="number" id="size">
    </div>

    <div class="input-group">
        <label>Enter array:</label>
        <input type="text" id="enterarray">
    </div>

    <p style="margin-top:10px;">Enter elements separated by space or comma</p>

    <br>
    <button id="generate">Generate</button>

    <p id="array" style="margin-top:20px;"></p>

    <div class="buttons">
        <button id="bubble">Bubble Sort</button>
        <button id="selection">Selection Sort</button>
        <button id="insertion">Insertion Sort</button>
        <button id="merge">Merge Sort</button>
        <button id="count">Count Sort</button>
        <button id="radix">Radix Sort</button>
    </div>

    <div id="container"></div>
    <p id="result"></p>
</div>

    
    <script src="script.js"></script>
</body>
</html>
